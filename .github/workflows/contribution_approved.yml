name: Contribution approved

# A maintainer adds the "approved" label to a New Internship / Edit Internship /
# Add a Company issue -> apply it, rebuild, close the issue.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply submission
        id: apply
        continue-on-error: true
        run: python -m scraper.contrib
      - name: Report failure
        if: steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ERR: ${{ steps.apply.outputs.error }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "⚠️ Couldn't apply this automatically: ${ERR:-see the workflow logs}"
          gh issue edit ${{ github.event.issue.number }} --remove-label approved
          exit 1
      - name: Scrape newly added company
        if: contains(github.event.issue.labels.*.name, 'add_company')
        run: python -m scraper.scrape --only "$(python -c 'import json,os;from scraper.contrib import parse_form,field;e=json.load(open(os.environ["GITHUB_EVENT_PATH"]));print(field(parse_form(e["issue"]["body"]),"company name"))')" || true
      - name: Regenerate READMEs and site data
        run: python -m scraper.readme
      - name: Commit
        id: commit
        env:
          MSG: ${{ steps.apply.outputs.commit_message }}
        run: |
          git config user.name "biotech-internships-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$MSG" -m "Closes #${{ github.event.issue.number }}" \
            -m "Co-authored-by: ${{ github.event.issue.user.login }} <${{ github.event.issue.user.id }}+${{ github.event.issue.user.login }}@users.noreply.github.com>"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "✅ Added — thanks for contributing! It'll show up on the README and site within a minute."

  deploy:
    needs: apply
    if: needs.apply.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
