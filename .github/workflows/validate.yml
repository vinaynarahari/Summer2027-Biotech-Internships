name: Validate

on:
  pull_request:
    paths: [".github/scripts/listings.json", "companies.json", "scraper/**", "tests/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python -m scraper.readme
      - run: python -m scraper.scrape --only Ginkgo --dry-run
